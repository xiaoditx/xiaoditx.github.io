name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]  # 如果是 master 分支则改为 [master]

  # 允许你在 GitHub 上手动触发一次构建
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.2  # 建议与你本地版本一致
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 这很重要，用于拉取你的主题
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Hugo
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # 复制额外的静态文件到public目录
      - name: Copy static folders
        run: |
          cp -r pages ./public/
          cp -r chouxiang ./public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Submit sitemap to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          BASE_URL="${SITE_URL%/}"
          HOST=$(echo "$BASE_URL" | sed -e 's|^https\?://||')
          # 从 public/sitemap.xml 中提取所有子站点地图的 <loc> 内容
          # 注意：Hugo 生成的 sitemap 索引中每个 <sitemap> 都有一个 <loc>
          # 使用 grep + sed 提取，排除根索引自身（不会出现）
          SUB_URLS=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -e 's/<loc>//g' -e 's/<\/loc>//g')
          # 将换行分隔转为逗号分隔的 JSON 数组
          JSON_URLS=$(echo "$SUB_URLS" | awk '{printf "\"%s\",", $0}' | sed 's/,$//')
          JSON_DATA="{\"host\":\"$HOST\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[$JSON_URLS]}"
          curl -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json" \
            -d "$JSON_DATA"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4